[project]
name = "mcp-clearlydefined"
version = "0.1.0"
description = "MCP server for querying clearlydefined.io"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27.0",
  "mcp[cli]>=1.12.0,<2.0.0",
]

[project.scripts]
clearlydefined-mcp = "mcp_clearlydefined.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
